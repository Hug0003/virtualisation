name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labo-virtualisation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: labo-virtualisation/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Image Docker (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image de test
        uses: docker/build-push-action@v6
        with:
          context: labo-virtualisation
          load: true
          tags: labo-virtualisation:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée du conteneur
        run: |
          docker run -d --name labo -p 8080:80 labo-virtualisation:test
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ | grep -q "Labo Virtualisation"; then
              echo "Le conteneur répond."
              exit 0
            fi
            sleep 1
          done
          docker logs labo
          exit 1

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Publication sur GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: labo-virtualisation
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
